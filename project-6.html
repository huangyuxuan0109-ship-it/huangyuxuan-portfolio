<style>
/* 第 3、4 页保持原尺寸与比例，仅统一顶端基线 */
#traits .grid-two{align-items:start}
#traits .grid-two .image-panel:nth-child(2){margin-top:0}

/* 第 5—8 页产品风格：中央主图、两侧预览 */
#style{overflow:hidden}
.style-showcase{position:relative;width:100%}
.style-track{display:flex;align-items:center;gap:24px;width:100%;overflow-x:auto;padding:18px 8% 30px;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;cursor:grab;touch-action:pan-y}
.style-track::-webkit-scrollbar{display:none}
.style-track.dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.style-slide{flex:0 0 78%;margin:0;scroll-snap-align:center;opacity:.34;transform:scale(.88);transition:transform .55s ease,opacity .55s ease;cursor:zoom-in;overflow:hidden;background:var(--pale)}
.style-slide.active{opacity:1;transform:scale(1)}
.style-slide img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;pointer-events:none}
.style-controls{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:8px;color:var(--blue);font-size:11px;letter-spacing:.16em}
.style-controls button{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--blue);font-size:18px;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.style-controls button:hover{border-color:var(--blue);background:var(--blue);color:#fff}
@media(max-width:760px){#traits .grid-two .image-panel:nth-child(2){margin-top:0}.style-track{gap:12px;padding:12px 6% 22px}.style-slide{flex-basis:88%;transform:scale(.92)}.style-controls button{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){.style-track{scroll-behavior:auto}.style-slide{transition:none}}

/* 产品风格与设计元素的蓝色章节分割线 */
#style>.section-head,#elements>.section-head{border-top:1px solid var(--blue)!important;padding-top:16px}
#style>.section-head h2,#elements>.section-head h2{color:var(--blue)}

/* 第 9—11 页：横向滑动查看 */
.elements-gallery{position:relative;width:100%;overflow:hidden}
.elements-track{display:flex;align-items:center;gap:24px;width:100%;overflow-x:auto;padding:18px 8% 30px;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;cursor:grab;touch-action:pan-y}
.elements-track::-webkit-scrollbar{display:none}
.elements-track.dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.element-item{position:relative;flex:0 0 78%;margin:0;overflow:hidden;background:#fff;cursor:zoom-in;scroll-snap-align:center;opacity:.34;transform:scale(.88);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease}
.element-item.active{opacity:1;transform:scale(1)}
.element-item img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;pointer-events:none;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.element-item.active:hover{box-shadow:0 24px 70px #0c4f8024}
.element-item.active:hover img{transform:scale(1.012)}
.element-number{position:absolute;right:14px;bottom:12px;padding:6px 9px;background:#ffffffdc;color:var(--blue);font-size:10px;letter-spacing:.14em;backdrop-filter:blur(8px)}
.elements-controls{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:8px;color:var(--blue);font-size:11px;letter-spacing:.16em}
.elements-controls button{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--blue);font-size:18px;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.elements-controls button:hover{border-color:var(--blue);background:var(--blue);color:#fff}

/* 两张应用图采用等高比例双栏，左右上下边线同时齐平 */

#applications .app-gallery .image-panel{width:100%;height:auto;background:transparent;overflow:hidden}
#applications .app-gallery .image-panel img{display:block;width:100%;height:auto;object-fit:contain}
#applications .app-index{text-align:right}
#final .final{min-height:auto;padding:0}
#final .final img{display:block;width:min(100%,1000px);margin:auto}
@media(max-width:760px){.elements-track{gap:12px;padding:12px 6% 22px}.element-item{flex-basis:88%;transform:scale(.92)}.elements-controls button{width:38px;height:38px}#applications .app-gallery{grid-template-columns:1fr;gap:14px}#applications .app-index{text-align:left}}
@media(prefers-reduced-motion:reduce){.elements-track{scroll-behavior:auto}.element-item,.element-item img{transition:none}}
</style>

<script>
const sections=[...document.querySelectorAll("main section")],links=[...document.querySelectorAll(".rail a")],bar=document.querySelector(".progress i"),topBtn=document.querySelector(".to-top");function update(){const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;bar.style.height=(max?y/max*100:0)+"%";topBtn.classList.toggle("show",y>500);let n=0;sections.forEach((s,i)=>{if(y>=s.offsetTop-innerHeight*.35)n=i});links.forEach((a,i)=>a.classList.toggle("active",i===n-1||i===n))}addEventListener("scroll",update,{passive:true});update();topBtn.onclick=()=>scrollTo({top:0,behavior:"smooth"});
const lb=document.querySelector(".lightbox"),li=lb.querySelector("img");document.querySelectorAll("img").forEach(img=>{if(!img.closest(".brand")&&!img.closest(".style-track")&&!img.closest(".elements-track"))img.onclick=()=>{li.src=img.src;li.alt=img.alt;lb.classList.add("open")}});lb.onclick=e=>{if(e.target===lb||e.target.tagName==="BUTTON")lb.classList.remove("open")};
const styleTrack=document.querySelector(".style-track"),styleSlides=[...document.querySelectorAll(".style-slide")],styleCount=document.querySelector(".style-count");let styleIndex=0,dragStart=0,scrollStart=0,dragged=false;
function setStyleActive(index,scroll=true){styleIndex=(index+styleSlides.length)%styleSlides.length;styleSlides.forEach((slide,i)=>slide.classList.toggle("active",i===styleIndex));styleCount.textContent=String(styleIndex+1).padStart(2,"0")+" / "+String(styleSlides.length).padStart(2,"0");if(scroll)styleSlides[styleIndex].scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest",inline:"center"})}
document.querySelector(".style-prev").onclick=()=>setStyleActive(styleIndex-1);document.querySelector(".style-next").onclick=()=>setStyleActive(styleIndex+1);
styleTrack.addEventListener("pointerdown",e=>{dragged=false;dragStart=e.clientX;scrollStart=styleTrack.scrollLeft;styleTrack.classList.add("dragging");styleTrack.setPointerCapture(e.pointerId)});styleTrack.addEventListener("pointermove",e=>{if(!styleTrack.hasPointerCapture(e.pointerId))return;const delta=e.clientX-dragStart;if(Math.abs(delta)>5)dragged=true;styleTrack.scrollLeft=scrollStart-delta});styleTrack.addEventListener("pointerup",e=>{styleTrack.releasePointerCapture(e.pointerId);styleTrack.classList.remove("dragging");const center=styleTrack.scrollLeft+styleTrack.clientWidth/2;let nearest=0,distance=Infinity;styleSlides.forEach((slide,i)=>{const d=Math.abs(slide.offsetLeft+slide.offsetWidth/2-center);if(d<distance){distance=d;nearest=i}});setStyleActive(nearest)});
styleSlides.forEach((slide,i)=>slide.addEventListener("click",()=>{if(dragged)return;setStyleActive(i,false);const img=slide.querySelector("img");li.src=img.src;li.alt=img.alt;lb.classList.add("open")}));setStyleActive(0,false);

document.querySelector(".elements-prev").onclick=()=>setElementsActive(elementsIndex-1);document.querySelector(".elements-next").onclick=()=>setElementsActive(elementsIndex+1);
elementsTrack.addEventListener("pointerdown",e=>{eDragged=false;eDragStart=e.clientX;eScrollStart=elementsTrack.scrollLeft;elementsTrack.classList.add("dragging");elementsTrack.setPointerCapture(e.pointerId)});elementsTrack.addEventListener("pointermove",e=>{if(!elementsTrack.hasPointerCapture(e.pointerId))return;const delta=e.clientX-eDragStart;if(Math.abs(delta)>5)eDragged=true;elementsTrack.scrollLeft=eScrollStart-delta});elementsTrack.addEventListener("pointerup",e=>{elementsTrack.releasePointerCapture(e.pointerId);elementsTrack.classList.remove("dragging");const center=elementsTrack.scrollLeft+elementsTrack.clientWidth/2;let nearest=0,distance=Infinity;elementItems.forEach((item,i)=>{const d=Math.abs(item.offsetLeft+item.offsetWidth/2-center);if(d<distance){distance=d;nearest=i}});setElementsActive(nearest)});
elementItems.forEach((item,i)=>item.addEventListener("click",()=>{if(eDragged)return;setElementsActive(i,false);const img=item.querySelector("img");li.src=img.src;li.alt=img.alt;lb.classList.add("open")}));setElementsActive(0,false);
