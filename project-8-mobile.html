<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手机端预览｜PPT设计作品</title>
    <style>
      *{box-sizing:border-box}
      html,body{margin:0;min-height:100%;background:#d8d4cc;color:#191919;font-family:"Microsoft YaHei","微软雅黑",sans-serif}
      body{display:grid;place-items:center;padding:22px}
      .mobile-stage{width:min(390px,100%);height:min(844px,calc(100vh - 44px));overflow:hidden;border:8px solid #171717;border-radius:28px;background:#111;box-shadow:0 22px 70px rgba(0,0,0,.24)}
      iframe{display:block;width:100%;height:100%;border:0;background:#fff}
      @media(max-width:430px){body{padding:0}.mobile-stage{width:100%;height:100vh;border:0;border-radius:0}}
    </style>
  </head>
  <body>
    <main class="mobile-stage" aria-label="手机端可交互网页">
      <iframe src="./project-8.html" title="PPT设计作品手机端页面"></iframe>
    </main>
  </body>
</html>
